<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Golden Cross Stock Screener - Track stocks showing bullish crossover signals based on 50-day and 200-day moving averages.">
  <meta name="keywords" content="Golden Cross, Stock Screener, Technical Analysis, SMA Crossover, Nifty, Indian Stocks">
  <title>Golden Cross Screener 📈</title>
  <link href="icons8-rupee-48.png" rel="shortcut icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.min.css" />
    <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PB8VW32FTL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-PB8VW32FTL');
  </script>
  <style>
    .golden-cross-date {
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="dashboard-shell">
    <div class="dashboard-header">
      <div>
        <p class="dashboard-kicker">Trend Screener</p>
        <h1 class="dashboard-title">Golden Cross Screener</h1>
        <p class="dashboard-subtitle mb-0">Stocks where shorter moving averages have crossed above the long-term trend.</p>
      </div>
      <button class="btn btn-outline-secondary" id="modeToggle" type="button" title="Toggle Theme">
        <span class="material-icons-outlined" id="modeIcon">dark_mode</span>
      </button>
    </div>

    <section class="summary-grid screener-summary-grid" aria-live="polite">
      <div class="summary-tile">
        <span class="summary-label">Signals</span>
        <strong id="goldenTotal">0</strong>
      </div>
      <div class="summary-tile">
        <span class="summary-label">Latest Date</span>
        <strong class="screener-summary-value" id="goldenLatestDate">N/A</strong>
      </div>
      <div class="summary-tile">
        <span class="summary-label">Highest Price</span>
        <strong class="screener-summary-value" id="goldenHighestPrice">N/A</strong>
      </div>
    </section>

    <section class="dashboard-controls">
      <div class="control-grid screener-control-grid">
        <div class="control-field">
          <label class="form-label" for="goldenSearch">Search Symbol</label>
          <div class="input-group">
            <span class="input-group-text"><span class="material-icons-outlined">search</span></span>
            <input class="form-control" id="goldenSearch" type="search" placeholder="ICICIBANK" autocomplete="off">
          </div>
        </div>
        <div class="control-field">
          <label class="form-label" for="goldenSort">Sort By</label>
          <select class="form-select" id="goldenSort">
            <option value="dateDesc">Latest Cross First</option>
            <option value="symbol">Symbol A-Z</option>
            <option value="priceDesc">Price High-Low</option>
            <option value="priceAsc">Price Low-High</option>
          </select>
        </div>
      </div>
    </section>

    <section class="section-heading">
      <div>
        <p class="dashboard-kicker">Current Snapshot</p>
        <h2>Signals</h2>
      </div>
      <span class="text-muted small" id="goldenResultCount">0 results</span>
    </section>

    <div class="screener-table-wrap" id="goldenTableWrap">
      <table class="table table-bordered table-striped table-hover screener-table">
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Golden Cross Date</th>
            <th>Last Price (₹)</th>
          </tr>
        </thead>
        <tbody id="results">
          <tr><td colspan="3">Loading Golden Cross signals...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/themeToggle.min.js"></script>
  <script src="js/goldenCross.min.js"></script>
</body>
</html>
