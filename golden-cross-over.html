<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Golden Cross Stock Screener - Track stocks showing bullish crossover signals based on 50-day and 200-day moving averages.">
  <meta name="keywords" content="Golden Cross, Stock Screener, Technical Analysis, SMA Crossover, Nifty, Indian Stocks">
  <title>Golden Cross Screener 📈</title>
    <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PB8VW32FTL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-PB8VW32FTL');
  </script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      color: #333;
    }

    .page-shell {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 1.25rem;
    }

    h1 {
      margin: 0 0 1rem;
      text-align: center;
      color: #2c3e50;
      overflow-wrap: anywhere;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }

    table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      background: #fff;
    }

    th, td {
      padding: 0.75rem;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #34495e;
      color: white;
    }
    tr:hover {
      background-color: #f1f1f1;
    }

    @media (max-width: 600px) {
      .page-shell {
        padding: 1rem 0.75rem;
      }

      h1 {
        font-size: 1.55rem;
      }

      .table-wrap {
        box-shadow: none;
        overflow-x: visible;
      }

      table {
        min-width: 0;
        background: transparent;
      }

      table, thead, tbody, th, td, tr {
        display: block;
      }
      th {
        display: none;
      }
      td {
        position: relative;
        min-height: 44px;
        padding-left: 48%;
        text-align: left;
        border-bottom: 1px solid #e4e4e4;
        background: #fff;
      }

      tr {
        margin-bottom: 0.85rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
      }

      td::before {
        position: absolute;
        left: 0.75rem;
        top: 0.75rem;
        width: 40%;
        font-weight: bold;
        overflow-wrap: anywhere;
      }

      td:nth-of-type(1)::before { content: "Symbol"; }
      td:nth-of-type(2)::before { content: "Golden Cross Date"; }
      td:nth-of-type(3)::before { content: "Last Price (₹)"; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <h1>📊 Golden Cross Screener</h1>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Golden Cross Date</th>
            <th>Last Price (₹)</th>
          </tr>
        </thead>
        <tbody id="results">
          <!-- Rows will be injected via JS or static HTML -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    // If loading from a JSON file, you can fetch and populate like this
    fetch('data/golden_cross.json')
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById('results');
        if (!Array.isArray(data) || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3">No Golden Cross signals found.</td></tr>';
          return;
        }
        data.forEach(row => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${row.Symbol}</td>
            <td>${row["Golden Cross Date"]}</td>
            <td>₹${row["Last Price"]}</td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(err => {
        document.getElementById('results').innerHTML = `<tr><td colspan="3">Failed to load data</td></tr>`;
        console.error(err);
      });
  </script>
</body>
</html>
