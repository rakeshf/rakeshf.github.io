    <style>
        body {
            padding: 0;
        }

        .page-shell {
            width: min(1180px, 100%);
            padding: 1.25rem;
        }

        .page-toolbar {
            gap: 0.75rem;
        }

        .page-title {
            overflow-wrap: anywhere;
        }

        #tableSummary {
            min-height: 1.5rem;
        }

        #tableContainer {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }

        .breakout {
            font-weight: bold;
            color: green;
        }

        @media (max-width: 576px) {
            .page-shell {
                padding: 1rem 0.75rem;
            }

            h2 {
                font-size: 1.5rem;
            }

            .page-toolbar {
                align-items: flex-start !important;
                flex-direction: column;
            }

            #modeToggle {
                width: 100%;
            }

            .table thead {
                display: none;
            }

            .table,
            .table tbody,
            .table tr,
            .table td {
                display: block;
                width: 100%;
            }

            .table tr {
                margin-bottom: 1rem;
                border: 1px solid #ddd;
                border-radius: 8px;
                padding: 0.5rem;
                overflow: hidden;
            }

            .table td {
                min-height: 42px;
                text-align: left;
                padding-left: 44%;
                position: relative;
                border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            }

            .table td::before {
                content: attr(data-label);
                position: absolute;
                left: 0.75rem;
                width: 38%;
                padding-right: 10px;
                text-align: left;
                font-weight: bold;
                overflow-wrap: anywhere;
            }

            [data-bs-theme="dark"] .table tr {
                border-color: #2d3842;
            }

            [data-bs-theme="dark"] .table td {
                border-bottom-color: #2d3842;
            }
        }
    </style>
</head>

<body>
    <div class="container page-shell">
        <div class="d-flex flex-wrap justify-content-between align-items-center page-toolbar mb-3">
            <h2 class="page-title mb-0">📊 Darvas Box Breakout Screener</h2>
            <button class="btn btn-outline-secondary" id="modeToggle" type="button" title="Toggle Theme">
                <span class="material-icons-outlined" id="modeIcon">dark_mode</span>
            </button>
        </div>
        <div id="tableSummary" class="text-muted small mb-3"></div>
        <div id="tableContainer">
            <div class="alert alert-info">Loading Darvas Box signals...</div>
        </div>
    </div>

    <script src="js/renderTable.js"></script>

</body>
