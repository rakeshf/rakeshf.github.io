<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Darvas Box Breakouts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <meta name="description"
        content="Darvas Box Breakout Screener for Indian stocks. Identify potential breakout opportunities using the Darvas Box trading strategy. Real-time analysis of NSE stocks like RELIANCE, TCS, INFY, HDFCBANK." />
    <meta name="keywords"
        content="Darvas Box, Darvas Strategy, Stock Breakout Screener, NSE Breakouts, Indian Stock Market, RELIANCE breakout, TCS, INFY, HDFCBANK, Technical Analysis, Price Action, Trading Strategy, Stock Screener" />
    <meta name="author" content="Rakesh Falke" />
    <meta name="robots" content="index, follow" />
    <link href="icons8-rupee-48.png" rel="shortcut icon">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <script src="js/themeToggle.js" defer></script>
      <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PB8VW32FTL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-PB8VW32FTL');
  </script>
    <link rel="stylesheet" href="css/main.css" />
</head>

<body>
    <main class="dashboard-shell">
        <div class="dashboard-header">
            <div>
                <p class="dashboard-kicker">Technical Screener</p>
                <h1 class="dashboard-title">Darvas Box Breakouts</h1>
                <p class="dashboard-subtitle mb-0">Breakout and breakdown setups from the latest generated data.</p>
            </div>
            <button class="btn btn-outline-secondary" id="modeToggle" type="button" title="Toggle Theme">
                <span class="material-icons-outlined" id="modeIcon">dark_mode</span>
            </button>
        </div>

        <section class="summary-grid screener-summary-grid" aria-live="polite">
            <div class="summary-tile">
                <span class="summary-label">Active</span>
                <strong id="darvasTotal">0</strong>
            </div>
            <div class="summary-tile">
                <span class="summary-label">Upside</span>
                <strong id="darvasUpside">0</strong>
            </div>
            <div class="summary-tile">
                <span class="summary-label">Downside</span>
                <strong id="darvasDownside">0</strong>
            </div>
            <div class="summary-tile">
                <span class="summary-label">Confirmed</span>
                <strong id="darvasConfirmed">0</strong>
            </div>
        </section>

        <section class="dashboard-controls">
            <div class="control-grid screener-control-grid">
                <div class="control-field">
                    <label class="form-label" for="darvasSearch">Search Symbol</label>
                    <div class="input-group">
                        <span class="input-group-text"><span class="material-icons-outlined">search</span></span>
                        <input class="form-control" id="darvasSearch" type="search" placeholder="RELIANCE" autocomplete="off">
                    </div>
                </div>
                <div class="control-field">
                    <label class="form-label" for="darvasDirectionFilter">Direction</label>
                    <select class="form-select" id="darvasDirectionFilter">
                        <option value="All">All</option>
                        <option value="up">Upside</option>
                        <option value="down">Downside</option>
                    </select>
                </div>
                <div class="control-field">
                    <label class="form-label" for="darvasSignalFilter">Signal</label>
                    <select class="form-select" id="darvasSignalFilter">
                        <option value="All">All Signals</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="pre">Pre-breakout</option>
                    </select>
                </div>
                <div class="control-field">
                    <label class="form-label" for="darvasSort">Sort By</label>
                    <select class="form-select" id="darvasSort">
                        <option value="symbol">Symbol A-Z</option>
                        <option value="pctDesc">% Change High-Low</option>
                        <option value="closeDesc">Close High-Low</option>
                        <option value="targetDesc">Target High-Low</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="section-heading">
            <div>
                <p class="dashboard-kicker">Current Snapshot</p>
                <h2>Signals</h2>
            </div>
            <span id="tableSummary" class="text-muted small"></span>
        </section>

        <div id="tableContainer" class="screener-table-wrap">
            <div class="empty-state">
                <span class="material-icons-outlined">hourglass_top</span>
                <strong>Loading Darvas Box signals...</strong>
            </div>
        </div>
    </main>

    <script src="js/renderTable.js"></script>

</body>

</html>
