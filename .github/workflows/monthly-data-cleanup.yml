name: Monthly data cleanup

on:
  schedule:
    # GitHub schedules use UTC. 03:00 UTC on day 1 = 08:30 Asia/Kolkata
    # on the first day of each month.
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monthly-data-cleanup
  cancel-in-progress: false

jobs:
  cleanup-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clear generated data folder
        run: |
          mkdir -p data
          find data -type f -delete
          printf "[]\n" > data/index.json

      - name: Commit cleanup
        id: commit-cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data cleanup changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Monthly cleanup of generated data"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        if: steps.commit-cleanup.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        if: steps.commit-cleanup.outputs.changed == 'true'
        run: bash scripts/prepare_pages_artifact.sh

      - name: Upload Pages artifact
        if: steps.commit-cleanup.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        if: steps.commit-cleanup.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
