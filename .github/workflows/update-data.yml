name: Update market JSON data

on:
  schedule:
    # GitHub schedules use UTC. These run 5 times on weekdays during
    # Indian market hours, using off-peak minutes because top-of-hour
    # schedules are more likely to be delayed or skipped by GitHub Actions:
    # 09:35, 10:40, 11:45, 13:05, 14:35 Asia/Kolkata.
    - cron: "5 4,9 * * 1-5"
    - cron: "10 5 * * 1-5"
    - cron: "15 6 * * 1-5"
    - cron: "35 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-market-json
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show trigger context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate JSON data
        run: |
          # GitHub may delay scheduled jobs until after market hours.
          bash scripts/update_data.sh --debug
          if git diff --quiet -- data/index.json; then
            echo "Market-data generation did not update data/index.json." >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          index = json.loads(Path("data/index.json").read_text())
          if not isinstance(index, list) or not index:
              raise SystemExit("data/index.json must contain at least one snapshot.")

          latest = index[0]
          if not isinstance(latest, str):
              raise SystemExit("The latest data/index.json entry must be a filename.")

          snapshot_path = Path("data") / latest
          if not snapshot_path.is_file():
              raise SystemExit(f"Indexed market-data snapshot is missing: {snapshot_path}")

          snapshot = json.loads(snapshot_path.read_text())
          if not isinstance(snapshot, list) or not snapshot:
              raise SystemExit(f"Market-data snapshot is empty or invalid: {snapshot_path}")
          PY

      - name: Commit generated data
        id: commit-generated-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update generated market JSON data"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        if: steps.commit-generated-data.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        if: steps.commit-generated-data.outputs.changed == 'true'
        run: bash scripts/prepare_pages_artifact.sh

      - name: Upload Pages artifact
        if: steps.commit-generated-data.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        if: steps.commit-generated-data.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
