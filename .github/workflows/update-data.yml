name: Update market JSON data

on:
  schedule:
    # GitHub schedules use UTC. These run every 30 minutes on weekdays during
    # Indian market hours: 09:15-15:15 Asia/Kolkata.
    - cron: "45 3 * * 1-5"
    - cron: "15,45 4-8 * * 1-5"
    - cron: "15,45 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-market-json
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate JSON data
        run: bash scripts/update_data.sh

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logs
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "Update generated market JSON data"
            git push
          fi
